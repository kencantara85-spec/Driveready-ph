.dr-login {
  --navy: #0b1728;
  --navy-light: #12243a;
  --card: #ffffff;
  --ink: #19283b;
  --muted: #718096;
  --line: #e6ebf1;
  --teal: #20c7a3;
  --teal-dark: #0e9f83;
  --gold: #ffc963;
  --danger: #bd3a43;
  --success: #147d61;
  font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.dr-login * {
  box-sizing: border-box;
}
.dr-login {
  min-height: 100vh;
  margin: 0;
  color: var(--ink);
  background: var(--navy);
}
.dr-login button, .dr-login input {
  font: inherit;
}
.dr-login button {
  -webkit-tap-highlight-color: transparent;
}
.dr-login .page-shell {
  min-height: 100vh;
  position: relative;
  overflow: hidden;
  background: radial-gradient(ellipse at 16% 13%, rgba(31, 83, 108, .36), transparent 36%), linear-gradient(140deg, #0b1728 0%, #101f33 58%, #0c1b2c 100%);
  padding: 0 clamp(20px, 5.5vw, 84px);
}
.dr-login .ambient {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(2px);
}
.dr-login .ambient-one {
  width: 430px;
  height: 430px;
  border: 1px solid rgba(32, 199, 163, .09);
  right: -190px;
  top: 12%;
  box-shadow: 0 0 0 45px rgba(32,199,163,.018), 0 0 0 95px rgba(32,199,163,.012);
}
.dr-login .ambient-two {
  width: 300px;
  height: 300px;
  background: rgba(255,201,99,.035);
  left: -180px;
  bottom: -100px;
}
.dr-login .topbar {
  max-width: 1350px;
  margin: 0 auto;
  height: 93px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 1;
}
.dr-login .brand {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  text-decoration: none;
  color: #f6fbff;
}
.dr-login .brand-mark {
  width: 43px;
  height: 43px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  color: var(--teal);
  background: rgba(32,199,163,.12);
  border: 1px solid rgba(32,199,163,.27);
  flex: 0 0 auto;
}
.dr-login .brand-mark svg {
  width: 30px;
  height: 30px;
}
.dr-login .brand-name {
  font: 800 20px/1.04 "Manrope", sans-serif;
  letter-spacing: -.7px;
  display: grid;
}
.dr-login .brand-name > span {
  display: inline;
  color: var(--teal);
}
.dr-login .brand-name small {
  color: #8ea2b8;
  font: 700 8px/1.6 "DM Sans", sans-serif;
  letter-spacing: 2.05px;
  margin-top: 2px;
}
.dr-login .top-note {
  font-size: 12px;
  color: #9aabbd;
  display: flex;
  align-items: center;
  gap: 8px;
}
.dr-login .online-dot, .dr-login .footer-dot {
  height: 7px;
  width: 7px;
  border-radius: 99px;
  background: var(--teal);
  box-shadow: 0 0 0 4px rgba(32,199,163,.12);
}
.dr-login .main-grid {
  max-width: 1280px;
  min-height: calc(100vh - 93px);
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(390px, 470px);
  gap: clamp(40px, 8vw, 130px);
  align-items: center;
  padding: 18px 0 44px;
  position: relative;
  z-index: 1;
}
.dr-login .welcome-panel {
  color: #f2f6fb;
  max-width: 590px;
  padding: 20px 0;
}
.dr-login .eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: #95aabe;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
}
.dr-login .eyebrow-line {
  width: 27px;
  height: 2px;
  border-radius: 9px;
  background: var(--teal);
}
.dr-login h1 {
  margin: 23px 0 15px;
  font: 800 clamp(42px, 5vw, 66px)/1.08 "Manrope", sans-serif;
  letter-spacing: -2.8px;
}
.dr-login h1 span {
  color: var(--teal);
}
.dr-login .welcome-copy {
  max-width: 420px;
  color: #a7b7c8;
  font-size: 15px;
  line-height: 1.8;
  margin: 0;
}
.dr-login .road-illustration {
  width: min(100%, 480px);
  height: 198px;
  position: relative;
  margin: 17px 0 19px;
  overflow: hidden;
  border-radius: 17px;
  background: linear-gradient(180deg, rgba(25,54,73,.15), rgba(8,20,34,.02));
}
.dr-login .sun-glow {
  position: absolute;
  width: 114px;
  height: 114px;
  background: rgba(255,201,99,.15);
  border-radius: 50%;
  right: 75px;
  top: 4px;
  filter: blur(9px);
}
.dr-login .horizon {
  position: absolute;
  bottom: 56px;
  border-radius: 50% 50% 0 0;
}
.dr-login .h1 {
  width: 82%;
  left: -5%;
  height: 97px;
  background: #172e40;
  transform: rotate(-5deg);
}
.dr-login .h2 {
  width: 69%;
  right: -7%;
  height: 75px;
  background: #1b3948;
  transform: rotate(7deg);
}
.dr-login .road-surface {
  position: absolute;
  left: 15%;
  right: 14%;
  height: 180px;
  bottom: -116px;
  background: linear-gradient(90deg,#26394a,#34475a 50%,#26394a);
  clip-path: polygon(41% 0,59% 0,100% 100%,0 100%);
}
.dr-login .road-edge {
  position: absolute;
  bottom: 1px;
  height: 125px;
  width: 2px;
  background: rgba(32,199,163,.42);
  transform-origin: bottom;
}
.dr-login .edge-left {
  left: 50%;
  transform: rotate(13deg);
}
.dr-login .edge-right {
  right: 48%;
  transform: rotate(-13deg);
}
.dr-login .road-dash {
  position: absolute;
  bottom: 15px;
  width: 3px;
  border-radius: 10px;
  background: var(--gold);
  left: 50%;
  transform: translateX(-50%);
}
.dr-login .dash-one {
  height: 22px;
  bottom: 17px;
}
.dr-login .dash-two {
  height: 14px;
  bottom: 56px;
  opacity: .8;
}
.dr-login .dash-three {
  height: 9px;
  bottom: 84px;
  opacity: .65;
}
.dr-login .sign-post {
  position: absolute;
  right: 71px;
  bottom: 29px;
  width: 36px;
  height: 83px;
}
.dr-login .sign-board {
  height: 34px;
  width: 34px;
  display: grid;
  place-items: center;
  transform: rotate(45deg);
  border: 3px solid #f7c35c;
  background: #f7f1df;
  border-radius: 4px;
  position: relative;
  z-index: 1;
  box-shadow: 0 3px 13px rgba(0,0,0,.12);
}
.dr-login .sign-board span {
  transform: rotate(-45deg);
  font: 800 20px/1 "Manrope", sans-serif;
  color: #c87927;
}
.dr-login .sign-stem {
  position: absolute;
  width: 4px;
  height: 56px;
  left: 15px;
  top: 29px;
  background: #a3b0ba;
  border-radius: 3px;
}
.dr-login .feature-list {
  display: flex;
  flex-wrap: wrap;
  gap: 21px 30px;
}
.dr-login .feature {
  display: flex;
  align-items: center;
  gap: 11px;
}
.dr-login .feature-icon {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  color: var(--teal);
  border: 1px solid rgba(32,199,163,.25);
  background: rgba(32,199,163,.08);
  border-radius: 10px;
  font-weight: 700;
}
.dr-login .feature strong, .dr-login .feature small {
  display: block;
}
.dr-login .feature strong {
  font-size: 12px;
  font-weight: 700;
  color: #e4edf6;
}
.dr-login .feature small {
  color: #8298ad;
  font-size: 10px;
  margin-top: 4px;
}
.dr-login .disclaimer {
  color: #6e839a;
  font-size: 10px;
  margin: 27px 0 0;
}
.dr-login .auth-area {
  width: 100%;
  max-width: 470px;
  justify-self: end;
}
.dr-login .auth-card {
  border-radius: 25px;
  background: var(--card);
  padding: clamp(27px, 4vw, 42px);
  box-shadow: 0 26px 90px rgba(0,0,0,.24), 0 2px 8px rgba(0,0,0,.04);
  border: 1px solid rgba(255,255,255,.65);
}
.dr-login .mobile-brand {
  display: none;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
}
.dr-login .mobile-brand .brand-name {
  color: var(--ink);
}
.dr-login .mobile-brand .brand-name small {
  color: #8996a7;
}
.dr-login .card-heading .mini-eyebrow {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.8px;
  color: var(--teal-dark);
  margin: 0 0 10px;
}
.dr-login .card-heading h2 {
  font: 800 clamp(25px, 2.4vw, 31px)/1.2 "Manrope", sans-serif;
  color: #172438;
  letter-spacing: -1px;
  margin: 0;
}
.dr-login .card-heading > p:last-child {
  color: #788699;

:root {
  --bg: #04050d;
  --cyan: #22d3ee;
  --violet: #8b5cf6;
  --magenta: #ec4899;
  --lime: #a3e635;
}
html, body {
  background: var(--bg);
  color: #e2e8f0;
  font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  background: radial-gradient(900px 500px at 12% -10%, rgba(139, 92, 246, 0.28), transparent 60%), radial-gradient(800px 500px at 100% 10%, rgba(34, 211, 238, 0.2), transparent 60%), radial-gradient(700px 500px at 50% 110%, rgba(236, 72, 153, 0.16), transparent 60%), var(--bg);
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image: linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
}
.font-display {
  font-family: "Manrope", "DM Sans", sans-serif;
}
.neon-text {
  background: linear-gradient(100deg, #22d3ee 0%, #8b5cf6 50%, #ec4899 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.neon-border {
  position: relative;
}
.neon-border::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(34, 211, 238, 0.7), rgba(139, 92, 246, 0.5), rgba(236, 72, 153, 0.7));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
.glass {
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.lift {
  transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}
.lift:hover {
  transform: translateY(-3px);
  border-color: rgba(34, 211, 238, 0.55);
  box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.25), 0 14px 40px -12px rgba(34, 211, 238, 0.35);
}
.scan {
  position: relative;
  overflow: hidden;
}
.scan::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -40%;
  height: 40%;
  background: linear-gradient(to bottom, transparent, rgba(34, 211, 238, 0.18), transparent);
  animation: scan 3.2s linear infinite;
  pointer-events: none;
}
@keyframes scan {
  to {
    top: 110%;
  }
}
@keyframes floaty {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}
@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(18px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes fadein {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.anim-pop {
  animation: pop 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
}
.anim-fade {
  animation: fadein 0.25s ease both;
}
.anim-rise {
  animation: rise 0.5s ease both;
}
.anim-float {
  animation: floaty 5s ease-in-out infinite;
}
input[type="search"]::-webkit-search-cancel-button {
  filter: invert(1);
}
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-thumb {
  background: rgba(139, 92, 246, 0.4);
  border-radius: 99px;
}
@media (prefers-reduced-motion: reduce) {
  .scan::after, .anim-float, .anim-pop, .anim-rise, .anim-fade {
    animation: none;
  }
  .lift {
    transition: none;
  }
}

  color: #6ee7b7;
}
.dq-badge.is-fail {
  border: 1px solid rgba(251, 113, 133, 0.7);
  background: rgba(251, 113, 133, 0.12);
  color: #fda4af;
}
.dq-stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 18px;
}
.dq-stats li {
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.04);
  padding: 10px 6px;
}
.dq-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.dq-head > div {
  flex: 1 1 11rem;
}
.dq-head svg, .dq-streak svg {
  flex-shrink: 0;
}
.st-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.st-tabs::-webkit-scrollbar {
  display: none;
}
.st-tabs button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  padding: 8px 16px;
  border-radius: 9999px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.05);
  font-size: 12.5px;
  font-weight: 500;
  color: #cbd5e1;
  white-space: nowrap;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}
.st-tabs button:hover {
  border-color: rgba(34, 211, 238, 0.6);
  color: #a5f3fc;
}
.st-tabs button[aria-selected="true"] {
  border-color: transparent;
  font-weight: 700;
  color: #020617;
  background: linear-gradient(90deg, #22d3ee, #8b5cf6);
  box-shadow: 0 0 18px -4px rgba(34, 211, 238, 0.8);
}
.st-count {
  min-width: 18px;
  padding: 0 5px;
  border-radius: 9999px;
  background: rgba(2, 6, 23, 0.35);
  font-size: 11px;
  line-height: 18px;
  text-align: center;
}
.st-chip {
  padding: 6px 12px;
  border-radius: 9999px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.05);
  font-size: 12px;
  color: #cbd5e1;
}
.st-chip[aria-pressed="true"] {
  border-color: rgba(34, 211, 238, 0.7);
  background: rgba(34, 211, 238, 0.12);
  color: #a5f3fc;
}
.st-bookmark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 9999px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.05);
  color: #94a3b8;
  transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}
.st-bookmark:hover {
  color: #a5f3fc;
  border-color: rgba(34, 211, 238, 0.6);
}
.st-bookmark[aria-pressed="true"] {
  color: #fcd34d;
  border-color: rgba(251, 191, 36, 0.7);
  background: rgba(251, 191, 36, 0.12);
}
.st-ring {
  width: 128px;
  height: 128px;
  flex-shrink: 0;
}
.st-level {
  display: inline-block;
  padding: 3px 11px;
  border-radius: 9999px;
  font-size: 11.5px;
  font-weight: 600;
  border: 1px solid currentColor;
}
.st-level.is-start {
  color: #fda4af;
  background: rgba(251, 113, 133, 0.1);
}
.st-level.is-building {
  color: #fcd34d;
  background: rgba(251, 191, 36, 0.1);
}
.st-level.is-almost {
  color: #67e8f9;
  background: rgba(34, 211, 238, 0.1);
}
.st-level.is-ready {
  color: #bef264;
  background: rgba(163, 230, 53, 0.1);
}
.st-miss {
  height: 100%;
  border-radius: 9999px;
}
.st-miss.is-weak {
  background: linear-gradient(90deg, #fb7185, #ec4899);
}
.st-miss.is-fair {
  background: linear-gradient(90deg, #fbbf24, #fb923c);
}
.st-miss.is-strong {
  background: linear-gradient(90deg, #34d399, #22d3ee);
}
.st-days {
  display: grid;
  grid-template-columns: repeat(14, 1fr);
  gap: 5px;
  margin-top: 14px;
}
.st-days li {
  aspect-ratio: 1;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.08);
}
.st-days li.is-on {
  background: linear-gradient(135deg, #22d3ee, #8b5cf6);
  box-shadow: 0 0 10px -2px rgba(34, 211, 238, 0.7);
}
.st-days li.is-today {
  outline: 2px solid rgba(255, 255, 255, 0.55);
  outline-offset: 1px;
}
.st-check {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  text-align: left;
  color: #e2e8f0;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.st-check:hover {
  border-color: rgba(34, 211, 238, 0.5);
}
.st-check.is-on {
  border-color: rgba(163, 230, 53, 0.5);
  background: rgba(163, 230, 53, 0.07);
  color: #cbd5e1;
}
.st-check-box {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  margin-top: 1px;
  border-radius: 6px;
  border: 1.5px solid rgba(255, 255, 255, 0.35);
  color: #020617;
}
.st-check.is-on .st-check-box {
  border-color: transparent;
  background: #a3e635;
}
.st-scale {
  display: inline-flex;
  gap: 6px;
}
.st-scale button {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.05);
  font-size: 14px;
  font-weight: 600;
  color: #cbd5e1;
}
.st-scale button[aria-checked="true"] {
  border-color: transparent;
  color: #020617;
  background: linear-gradient(135deg, #22d3ee, #8b5cf6);
}
.st-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}
.st-table th, .st-table td {
  padding: 6px 10px;
  text-align: left;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
.st-table th {
  color: #94a3b8;
  font-weight: 500;
}
textarea.pf-input {
  resize: vertical;
}

k":"Weak","topics.level.fair":"Needs practice","topics.level.strong":"Strong","topics.noneMissed":"Nothing missed","topics.practice":"Practise missed questions ({n})","topics.mostMissed":"Questions you miss most","topics.missedTimes":"Missed {n}\xD7","notebook.intro":"Every question you get wrong is saved here. Retry them, and each one leaves the notebook once you answer it correctly.","notebook.emptyTitle":"Your notebook is empty","notebook.emptyText":"Wrong answers from your tests will appear here.","notebook.retryTitle":"Mistake notebook retry","notebook.filter":"Filter by topic","notebook.filterAll":"All ({n})","notebook.retry":"Retry mistakes ({n})","notebook.limit":"Up to {n} questions per round.","notebook.missed":"Missed {n}\xD7","notebook.lastPick":"Your last answer: {a}","notebook.skipped":"Not answered last time","saved.intro":"Questions you bookmarked. Tap the bookmark icon in the reviewer or during a test to save a hard one.","saved.emptyTitle":"Nothing saved yet","saved.emptyText":"Tap the bookmark icon on a question to keep it here.","saved.quizTitle":"Saved questions quiz","saved.quiz":"Quiz me on saved questions ({n})","examday.intro":"The usual papers and steps for exam day, written in our own words. Tick items off as you get ready.","examday.warn":"Rules, fees and forms can change between offices and years. Always confirm on the official LTO page before you go.","examday.official":"Official LTO page","examday.portal":"LTMS Portal","examday.progress":"{a} of {n} ready","examday.reset":"Untick all","examday.sec.before":"Before the day","examday.sec.bring":"What to bring","examday.sec.day":"On exam day","examday.sec.after":"After the exam","examday.i1":"Create your account on the LTO LTMS Portal and keep your login details handy. Many LTO services start there.","examday.i2":"Finish the driving courses that apply to you. A student permit needs a theoretical driving course. A non-professional licence usually needs a practical driving course from an LTO-accredited school too.","examday.i3":"Get a medical certificate from an LTO-accredited clinic. The clinic normally sends it to the LTO electronically.","examday.i4":"Check the waiting time and your age. A student permit usually has to be held for at least a month before you can apply for a licence.","examday.i5":"Under 18? Ask the LTO what consent a parent or guardian must give, and prepare it with a copy of their valid ID.","examday.i6":"Your valid government-issued ID, plus photocopies.","examday.i7":"Your original student permit, if you are applying for a licence.","examday.i8":"Your course certificates and medical certificate, printed, with photocopies.","examday.i9":"A pen, your appointment details and enough money for the fees. Fees change, and not every office accepts e-payments, so check first.","examday.i10":"Sleep well and eat before you go. Arrive early, because queues can be long.","examday.i11":"Wear comfortable clothes and shoes you can drive safely in.","examday.i12":"Hand in your papers and pay at the counters the staff point you to. If you are not sure, ask. Do not guess.","examday.i13":"Written exam: read every question to the end before you answer. A pass mark of 80% is commonly reported, so confirm it with the LTO. Practise with the full mock exam in this app.","examday.i14":"Practical test: stay calm, check your mirrors, signal early and follow the examiner\u2019s instructions exactly.","examday.i15":"Check your details on the receipt or card before you leave the counter, and report any mistake right away.","examday.i16":"If you did not pass, ask how long you must wait before trying again. Use your mistake notebook to fix your weak spots.","examday.footer":"This checklist is a study aid written by DriveReady in its own words. It is not an official LTO document.","research.title":"Does DriveReady help? Test it yourself.","research.intro":"This is a small study you can do inside the app. You take a short test before you study, then the same questions again afterwards. The difference shows whether your score improved.","research.step1":"Take the pre-test. No hints, and the answers stay hidden.","research.step2":"Study with DriveReady the way you normally would.","research.step3":"Take the post-test: the same questions in a new order.","research.step4":"See your change, answer a short survey and share your result code with the person running the study.","research.privacy":"Your answers stay on this device. The result code holds only scores and survey numbers: no name and no email.","research.pickLicence":"Which licence are you studying for?","research.confBefore":"Before you start: how confident are you that you would pass the written exam today?","research.notConfident":"1 = not confident","research.veryConfident":"5 = very confident","research.begin":"Create my test","research.preTitle":"Pre-test","research.postTitle":"Post-test","research.preText":"{n} questions with no hints. The correct answers stay hidden until you finish the post-test. Do this before you study with DriveReady.","research.startPre":"Start the pre-test","research.preDone":"Pre-test done","research.studyNow":"Now study with DriveReady. Use the reviewer, practice tests and your mistake notebook. When you feel you have studied enough, take the post-test.","research.since":"Questions studied since your pre-test: {n}","research.startPost":"Start the post-test","research.resultTitle":"Your change","research.points":"{n} points","research.up":"Your score went up after studying.","research.down":"Your score went down this time. Go through your mistake notebook and keep practising.","research.same":"Your score stayed the same.","research.preLabel":"Pre-test","research.postLabel":"Post-test","research.caution":"This shows your own change only. One person is a small sample, and other things, like studying somewhere else, can change your score too.","research.surveyTitle":"Short survey","research.confBeforeWas":"Before the pre-test you rated your co akbang sa araw ng exam, sa sarili naming mga salita. Lagyan ng tsek habang naghahanda ka.","examday.warn":"Maaaring magbago ang mga patakaran, bayarin at porma sa bawat opisina at taon. Laging kumpirmahin sa opisyal na pahina ng LTO bago pumunta.","examday.official":"Opisyal na pahina ng LTO","examday.portal":"LTMS Portal","examday.progress":"{a} sa {n} ang handa","examday.reset":"Alisin ang lahat ng tsek","examday.sec.before":"Bago ang araw ng exam","examday.sec.bring":"Dalhin","examday.sec.day":"Sa araw ng exam","examday.sec.after":"Pagkatapos ng exam","examday.i1":"Gumawa ng account sa LTO LTMS Portal at itabi ang iyong login. Maraming serbisyo ng LTO ang nagsisimula roon.","examday.i2":"Tapusin ang mga kursong naaangkop sa iyo. Kailangan ng theoretical driving course para sa student permit. Karaniwang kailangan din ng practical driving course mula sa LTO-accredited na paaralan para sa non-professional na lisensya.","examday.i3":"Kumuha ng medical certificate mula sa LTO-accredited na klinika. Karaniwang ipinapadala ito ng klinika sa LTO nang electronic.","examday.i4":"Tingnan ang hinihintay na panahon at ang edad mo. Karaniwang kailangang hawak mo ang student permit nang hindi bababa sa isang buwan bago mag-apply ng lisensya.","examday.i5":"Wala pang 18? Itanong sa LTO kung anong pahintulot ang kailangan mula sa magulang o tagapag-alaga, at ihanda ito kasama ang kopya ng valid ID nila.","examday.i6":"Ang iyong valid na government-issued ID, kasama ang mga photocopy.","examday.i7":"Ang orihinal mong student permit, kung mag-aapply ka ng lisensya.","examday.i8":"Ang mga certificate ng kurso at medical certificate mo, naka-print, kasama ang mga photocopy.","examday.i9":"Bolpen, detalye ng appointment mo at sapat na pera para sa bayarin. Nagbabago ang bayarin at hindi lahat ng opisina ay tumatanggap ng e-payment, kaya alamin muna.","examday.i10":"Matulog nang maayos at kumain bago umalis. Dumating nang maaga dahil maaaring mahaba ang pila.","examday.i11":"Magsuot ng kumportableng damit at sapatos na ligtas gamitin sa pagmamaneho.","examday.i12":"Ipasa ang mga papeles at magbayad sa mga counter na itinuro ng staff. Kung hindi sigurado, magtanong. Huwag manghula.","examday.i13":"Written exam: basahin hanggang dulo ang bawat tanong bago sumagot. Karaniwang iniuulat na 80% ang pasadong marka, kaya kumpirmahin ito sa LTO. Magpraktis gamit ang buong mock exam sa app na ito.","examday.i14":"Practical test: manatiling kalmado, tingnan ang mga salamin, mag-signal nang maaga at sundin nang eksakto ang bilin ng examiner.","examday.i15":"Suriin ang iyong mga detalye sa resibo o card bago umalis sa counter, at agad ireport ang anumang mali.","examday.i16":"Kung hindi ka pumasa, itanong kung gaano katagal bago ka makakapag-retake. Gamitin ang mistake notebook para ayusin ang mahihinang bahagi.","examday.footer":"Ang checklist na ito ay gabay sa pag-aaral na isinulat ng DriveReady sa sarili nitong mga salita. Hindi ito opisyal na dokumento ng LTO.","research.title":"Nakakatulong ba ang DriveReady? Subukan mo mismo.","research.intro":"Maliit na pag-aaral ito na magagawa mo sa loob ng app. Kukuha ka ng maikling test bago mag-aral, at ang parehong mga tanong ulit pagkatapos. Ang pagkakaiba ang magpapakita kung bumuti ang iskor mo.","research.step1":"Kunin ang pre-test. Walang hint at nakatago ang mga sagot.","research.step2":"Mag-aral gamit ang DriveReady gaya ng nakasanayan mo.","research.step3":"Kunin ang post-test: ang parehong mga tanong sa bagong pagkakasunod-sunod.","research.step4":"Tingnan ang pagbabago mo, sagutan ang maikling survey at ibahagi ang result code sa nagpapatakbo ng pag-aaral.","research.privacy":"Nasa device na ito ang mga sagot mo. Iskor at numero ng survey lang ang laman ng result code: walang pangalan at walang email.","research.pickLicence":"Anong lisensya ang inaaralan mo?","research.confBefore":"Bago magsimula: gaano ka kakumpiyansa na papasa ka sa written exam ngayon?","research.notConfident":"1 = hindi kumpiyansa"
